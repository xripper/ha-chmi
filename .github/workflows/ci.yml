name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Requirements are resolved when a user installs the integration, so a new
  # upstream release can break installs without a commit here (pyfive 1.3.0
  # pulled in numcodecs, which has no musl wheel). Check weekly.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt ruff \
            $(jq -r '.requirements[]' custom_components/chmi/manifest.json)
      - run: ruff check .
      - run: pytest -q

  ha-install:
    # Install the manifest requirements inside the real Home Assistant image
    # (Alpine/musl) the same way Home Assistant does it at setup time. The
    # image runs through `docker run` rather than `container:` because GitHub
    # cannot run JavaScript actions inside Alpine containers on arm64.
    name: Requirements in HA ${{ matrix.tag }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        tag: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - name: Install requirements with Home Assistant's installer
        run: |
          docker run --rm -i -v "$PWD:/repo:ro" -w /repo --entrypoint python3 \
            ghcr.io/home-assistant/home-assistant:${{ matrix.tag }} - <<'EOF'
          import json
          import os
          import sys

          import homeassistant
          from homeassistant.util.package import install_package

          constraints = os.path.join(
              os.path.dirname(homeassistant.__file__), "package_constraints.txt"
          )
          with open("custom_components/chmi/manifest.json") as file:
              requirements = json.load(file)["requirements"]
          failed = [
              req
              for req in requirements
              if not install_package(req, constraints=constraints)
          ]
          if failed:
              sys.exit(f"Requirements not installable: {failed}")

          sys.path.insert(0, ".")
          import custom_components.chmi.api.merge  # noqa: E402, F401
          print("Installed:", ", ".join(requirements))
          EOF

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
