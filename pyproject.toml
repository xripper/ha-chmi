[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "PL",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "D203",
  "D213",
  "PLR0911",
  "PLR0912",
  "PLR2004",
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104", "PLC0415", "PLR2004", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
